<style>
:root{
  /* Exam-room palette: ink navy + answer-sheet paper + marker yellow */
  --ink:#16213a; --ink2:#2a3654; --paper:#f4f6fa; --card:#ffffff; --line:#d9dfea;
  --mute:#5d6882; --accent:#f2b230; --ok:#1f9a6a; --bad:#d6443a;
  --display:'Mitr','Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai','Prompt',system-ui,sans-serif;
  --read:'Literata','IBM Plex Sans Thai',Georgia,serif;
  /* layout: fixed 1920x1080 stage scaled to the window; each slide = one 16:9 frame */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d1426;color:var(--ink);font-family:var(--body);overflow:hidden;color-scheme:light}
.slide{position:absolute;inset:0;padding:64px 96px 48px;display:flex;flex-direction:column;gap:28px;font-size:28px;line-height:1.45}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15}
h2.t{font-size:56px;font-weight:600;letter-spacing:-.5px}
.eyebrow{font-family:var(--display);font-size:24px;font-weight:600;color:var(--tc,var(--mute));letter-spacing:1px;text-transform:uppercase;display:flex;gap:14px;align-items:center}
.eyebrow .bar{width:44px;height:8px;border-radius:4px;background:var(--tc,var(--accent))}
.small{font-size:22px;color:var(--mute)}
b{font-weight:600}
/* nav */
/* menu */
/* cards & tables */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 32px;display:flex;flex-direction:column;gap:12px}
.card h3{font-size:32px;font-weight:600}
.card.tip{background:#fff7e3;border-color:#f3d48a;font-size:26px;display:block}
.card.warn{background:#fff1ef;border-color:#f3c0b9}
.two{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.grid4 .card{font-size:23px}.grid4 .card h3{font-size:28px}
.grid4 ul{padding-left:24px;display:flex;flex-direction:column;gap:6px}
.num{font-family:var(--display);font-weight:700;color:#fff;background:var(--tc);align-self:flex-start;border-radius:8px;padding:2px 14px;font-size:22px}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:24px}
.tbl th{background:var(--ink);color:#fff;text-align:left;padding:12px 18px;font-family:var(--display);font-weight:500}
.tbl td{padding:10px 18px;border-top:1px solid var(--line);vertical-align:top}
.tbl.sm{font-size:21px}.tbl.sm td{padding:7px 14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips span{background:#fff;border:2px solid var(--bad);color:var(--bad);border-radius:999px;padding:4px 18px;font-weight:600}
ol.big{padding-left:34px;display:flex;flex-direction:column;gap:12px;font-size:25px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.step{background:var(--card);border-radius:18px;border:1px solid var(--line);padding:30px;position:relative;font-size:25px}
.step b:first-child{display:inline-flex;width:64px;height:64px;border-radius:50%;background:var(--tc);color:#fff;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;margin-bottom:12px}
.step h3{font-size:30px;margin-bottom:8px}
.idioms{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.idioms div{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--tc);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column}
.idioms b{font-family:var(--read);font-size:27px}.idioms span{color:var(--mute);font-size:23px}
.conj{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.conj div{background:var(--card);border-radius:14px;border:1px solid var(--line);border-top:10px solid var(--c);padding:20px 24px}
.conj h3{color:var(--c);font-size:30px}.conj p{font-family:var(--read);font-size:27px}.conj small{color:var(--mute);font-size:20px}
.cult{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.cult div{background:var(--card);border-radius:14px;border:1px solid var(--line);padding:18px 22px;display:flex;flex-direction:column;gap:4px;font-size:21px}
.cult b{font-family:var(--display);font-size:27px;color:var(--tc)}.cult i{font-style:normal;color:var(--mute);font-size:19px}
.flip{display:grid;grid-template-columns:110px 1fr;gap:8px 16px;align-items:center;background:#f2f5fb;border-radius:12px;padding:16px 20px;font-size:28px}
.flip div{font-family:var(--display);font-size:20px;color:#fff;background:var(--ink2);border-radius:8px;padding:2px 10px;text-align:center}
.flip u{text-decoration-color:var(--tc);text-decoration-thickness:4px}
.osas{display:flex;flex-wrap:wrap;gap:8px}
.osas span{background:#eef2f9;border-radius:10px;padding:6px 12px;font-size:20px;font-weight:600;display:flex;flex-direction:column;align-items:center}
.osas span i{font-weight:400;font-family:var(--read);color:var(--mute)}
.osas .n{background:var(--tc);color:#fff}.osas .n i{color:#e9fff6}
/* title & cover */
.dark{background:var(--ink);color:#fff}
.cover{background:radial-gradient(circle at 80% 30%,#24345c 0,#16213a 55%);color:#fff;padding:96px 110px 60px}
.cover h1{font-size:96px;font-weight:700;line-height:1.05;max-width:1100px}
.cover h1 em{font-style:normal;color:var(--accent)}
.cover .sub{font-size:34px;color:#c8d2e8;max-width:1000px}
.stats{display:flex;gap:28px;margin-top:auto}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:22px 30px;min-width:250px}
.stat b{display:block;font-family:var(--display);font-size:64px;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:22px;color:#c8d2e8}
.coverart{position:absolute;right:60px;top:110px;width:780px}
.topic{background:var(--ink);color:#fff;justify-content:center;gap:30px}
.topic .code{font-family:var(--display);font-size:150px;font-weight:700;color:var(--tc);line-height:1}
.topic h1{font-size:76px;max-width:1150px}
.topic .en{font-size:34px;color:#b8c3dd;font-family:var(--read)}
.topic .meta{display:flex;gap:24px}
.topic .meta div{border:2px solid var(--tc);border-radius:14px;padding:12px 24px;font-size:26px}
.topic .meta b{font-family:var(--display);font-size:40px;color:var(--tc);margin-right:8px}
.topic p.what{font-size:28px;color:#dbe2f2;max-width:1150px}
.topic .ticon{position:absolute;right:120px;top:50%;transform:translateY(-50%);width:440px;height:440px;opacity:.95}
/* blueprint */
.cells{display:grid;grid-template-columns:repeat(32,1fr);gap:6px}
.cells div{height:70px;border-radius:6px;background:var(--c);position:relative}
.cells div.ord{background:repeating-linear-gradient(45deg,var(--c),var(--c) 8px,#fff 8px,#fff 12px)}
.bp{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.bp .card{border-top:12px solid var(--c);font-size:21px;gap:8px}
.bp .card h3{font-size:26px}
.bp .big{font-family:var(--display);font-size:58px;color:var(--c);line-height:1;font-weight:700}
.bp .big small{font-size:22px;color:var(--mute);font-weight:500}
/* map */
.map{display:grid;grid-template-columns:200px repeat(5,1fr);gap:6px;font-size:19px}
.map .h{font-family:var(--display);font-weight:600;background:var(--ink);color:#fff;border-radius:8px;padding:8px 12px;text-align:center}
.map .r{font-family:var(--display);font-weight:600;padding:8px 10px;background:#e6ebf4;border-radius:8px;display:flex;align-items:center}
.map .c{border-radius:8px;padding:6px 10px;color:#fff;background:var(--c);cursor:pointer;line-height:1.25;display:flex;align-items:center}
.map .c:hover{filter:brightness(1.1)}
.legend{display:flex;gap:22px;flex-wrap:wrap;font-size:21px}
.legend span{display:flex;align-items:center;gap:8px}.legend i{width:22px;height:22px;border-radius:5px;background:var(--c)}
/* schedule */
.sched td:first-child{white-space:nowrap;font-family:var(--display)}
.sched td:nth-child(2){white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{display:inline-block;color:#fff;border-radius:999px;padding:2px 14px;font-size:18px;font-family:var(--display);background:var(--c)}
/* question set */
.sethead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.sethead h2{font-size:46px;font-weight:600}
.tags{display:flex;gap:10px;flex-wrap:wrap}
.tag{font-family:var(--display);font-size:20px;border-radius:999px;padding:4px 16px;background:#e7ebf3;color:var(--ink2);white-space:nowrap}
.tag.t{background:var(--tc);color:#fff}
.tag.y{background:var(--ink);color:#fff}
.tag.ok{background:#e3f6ec;color:#16774f}
.tag.new{background:var(--accent);color:var(--ink)}
.setbody{flex:1;display:grid;grid-template-columns:1.12fr 1fr;gap:36px;min-height:0}
.left{display:flex;flex-direction:column;gap:16px;min-height:0}
.sit{font-size:22px;color:var(--mute);font-style:italic}
.pic{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;justify-content:center;flex-shrink:0}
.pic img{max-width:100%;max-height:var(--ph,360px);object-fit:contain;border-radius:8px}
.pass{flex:1;min-height:120px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 28px;font-family:var(--read);font-size:var(--pf,25px);line-height:1.6}
.pass p{margin-bottom:10px}
.pass p.dl{padding-left:150px;text-indent:-150px;margin-bottom:6px}
.pass p.dl b{display:inline-block;width:150px;text-indent:0;font-family:var(--display);font-weight:600;color:var(--tc)}
.pass .blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--ink2);text-align:center;font-family:var(--display);font-weight:600;color:var(--ink2);padding:0 6px;border-radius:4px}
.pass .blank.cur{background:#fff3c6;border-color:var(--accent)}
.pass .blank.done{color:var(--ok);border-color:var(--ok)}
.pass h4{font-family:var(--display);font-size:22px;color:var(--tc);margin:8px 0 4px;letter-spacing:1px}
.vocab{display:flex;flex-wrap:wrap;gap:8px;flex-shrink:0;max-height:178px;overflow:auto}
.vocab span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 12px;font-size:19px}
.vocab span b{font-family:var(--read);color:var(--tc);font-weight:600;margin-right:6px}
.vlabel{font-family:var(--display);font-size:18px;color:var(--mute);letter-spacing:1px}
.right{display:flex;flex-direction:column;gap:16px;min-height:0}
.tabs{display:flex;gap:10px;flex-wrap:wrap}
.tab{font:inherit;font-family:var(--display);font-size:24px;width:72px;height:56px;border-radius:12px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
.tab.on{border-color:var(--tc);background:var(--tc);color:#fff}
.tab.ok{box-shadow:inset 0 -6px 0 var(--ok)}.tab.on.ok{box-shadow:inset 0 -6px 0 #b6f0d6}
.tab.bad{box-shadow:inset 0 -6px 0 var(--bad)}
.qtext{font-size:30px;font-weight:600;white-space:pre-line;line-height:1.35}
.qsub{display:inline-block;font-family:var(--display);font-size:19px;background:var(--tc);color:#fff;border-radius:999px;padding:2px 12px;margin-left:8px;vertical-align:middle;font-weight:500}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{font:inherit;font-size:26px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 20px;display:flex;gap:16px;align-items:center;cursor:pointer;color:var(--ink);line-height:1.3}
.opt:hover{border-color:var(--tc)}
.opt i{font-style:normal;font-family:var(--display);font-weight:600;flex:0 0 44px;height:44px;border-radius:50%;background:#eef1f7;display:flex;align-items:center;justify-content:center}
.opt.ok{border-color:var(--ok);background:#e8f8f0}.opt.ok i{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:#fdeceb}.opt.bad i{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.fb{background:#f0f9f4;border:2px solid #bfe8d3;border-radius:16px;padding:16px 22px;font-size:23px;line-height:1.5;overflow:auto;min-height:0}
.fb.wrong{background:#fff5f3;border-color:#f3c3bd}
.fb h4{font-family:var(--display);font-size:24px;margin-bottom:4px}
.acts{display:flex;gap:12px;margin-top:auto}
.btn{font:inherit;font-family:var(--display);font-size:21px;border:0;border-radius:12px;padding:10px 20px;cursor:pointer;background:var(--ink2);color:#fff}
.btn.ghost{background:#e7ebf3;color:var(--ink)}
.ord{display:flex;gap:12px;flex-wrap:wrap}
.ord button{font:inherit;font-family:var(--display);font-size:32px;width:76px;height:76px;border-radius:14px;border:2px solid var(--tc);background:#fff;color:var(--tc);cursor:pointer}
.ord button:disabled{opacity:.3;cursor:default}
.slots{display:flex;gap:10px}
.slots span{width:76px;height:76px;border-radius:14px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:32px;background:#fff}
.slots span.f{border-style:solid;border-color:var(--ink2)}
.slots small{display:block}
.minich{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.minich div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.minich h5{font-family:var(--display);font-size:18px}
/* drill */
.drill{display:flex;flex-direction:column;gap:14px;overflow:auto}
.drow{display:grid;grid-template-columns:150px 1fr;gap:20px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 20px;align-items:center}
.drow .src{font-family:var(--display);font-size:19px;color:var(--mute)}
.drow .sen{font-family:var(--read);font-size:22px;margin-bottom:8px}
.drow .sen u{text-decoration:none;background:#fff3c6;padding:0 8px;border-radius:4px;font-family:var(--display)}
.drow .os{display:flex;gap:10px;flex-wrap:wrap}
.drow .os button{font:inherit;font-size:20px;background:#f3f5fa;border:2px solid var(--line);border-radius:10px;padding:6px 14px;cursor:pointer}
.drow .os button.ok{border-color:var(--ok);background:#e8f8f0}.drow .os button.bad{border-color:var(--bad);background:#fdeceb}
.drow .why{font-size:19px;color:var(--ok);margin-top:6px}
.tipgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.tipgrid .card{font-size:24px}
.timeline{display:flex;height:84px;border-radius:14px;overflow:hidden;font-family:var(--display);font-size:20px;color:#fff}
.timeline div{display:flex;flex-direction:column;justify-content:center;padding:0 14px;background:var(--c)}

/* ---------- Krubenz brand & decoration ---------- */
.slide:not(.cover):not(.topic):not(.strand){background:radial-gradient(900px 520px at 104% -12%,color-mix(in srgb,var(--tc,#2f6fd6) 16%,transparent) 0,transparent 62%),radial-gradient(700px 400px at -6% 112%,rgba(242,178,48,.14) 0,transparent 60%),radial-gradient(#d6dde9 1.4px,transparent 1.6px) 0 0/30px 30px,var(--paper)}
.brand{position:absolute;top:22px;right:34px;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px;color:var(--ink);z-index:4;background:rgba(255,255,255,.85);padding:6px 16px 6px 6px;border-radius:999px;box-shadow:0 4px 14px rgba(22,33,58,.08)}
.brand.lt{background:rgba(255,255,255,.08);color:#fff;box-shadow:none}
.brand b{font-weight:700;letter-spacing:.3px}
.coverbrand{display:flex;align-items:center;gap:18px}
.coverbrand b{display:block;font-family:var(--display);font-size:44px;line-height:1;color:#fff}
.coverbrand span{font-size:20px;color:#f2b230;letter-spacing:2px;text-transform:uppercase}
.cover h1{font-size:88px}
.strandbtns{display:flex;gap:18px;max-width:1200px}
.strandbtns button,.stdlist button{font:inherit;text-align:left;cursor:pointer;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,#000) 0,var(--c) 100%);border:0;border-radius:18px;padding:18px 24px;display:flex;flex-direction:column;gap:2px;font-size:22px;box-shadow:0 10px 26px rgba(0,0,0,.25);transition:transform .15s}
.strandbtns button:hover,.stdlist button:hover{transform:translateY(-3px)}
.strandbtns b,.stdlist b{font-family:var(--display);font-size:30px}
.strandbtns i,.stdlist i{font-style:normal;opacity:.85;font-size:19px}
.stat{padding:14px 24px;min-width:200px}.stat b{font-size:48px}
.tag.st{background:color-mix(in srgb,var(--tc) 18%,#fff);color:var(--ink)}
.strip{display:flex;gap:14px}
.sgrp{display:flex;flex-direction:column;gap:8px}
.slab{font-family:var(--display);font-size:20px;color:#fff;background:var(--sc);border-radius:8px;padding:4px 12px}
.panels{display:flex;gap:22px}
.spanel{background:color-mix(in srgb,var(--sc) 9%,#fff);border:2px solid color-mix(in srgb,var(--sc) 35%,#fff);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sphead{font-family:var(--display);font-size:30px;font-weight:700;color:var(--sc)}.sphead span{color:var(--ink);font-weight:500}
.bp .card{padding:18px 20px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.facts div{background:var(--ink);color:#fff;border-radius:16px;padding:16px 22px}
.facts b{display:block;font-family:var(--display);font-size:38px;color:var(--accent);line-height:1.1}
.facts span{font-size:20px;color:#c8d2e8}
.timeline small{display:block;font-size:16px;opacity:.85}
.examtips .tipgrid .card{font-size:22px}
.strand{background:radial-gradient(900px 600px at 85% 20%,color-mix(in srgb,var(--sc) 45%,#16213a) 0,#16213a 70%);color:#fff;justify-content:center}
.strand h1{font-size:92px;max-width:1300px}
.strand .snum{position:absolute;right:110px;top:40px;font-family:var(--display);font-weight:700;font-size:520px;line-height:1;color:rgba(255,255,255,.07)}
.strand .meta{display:flex;gap:24px}.strand .meta div{border:2px solid var(--sc);border-radius:14px;padding:10px 22px;font-size:26px}.strand .meta b{font-family:var(--display);font-size:40px;color:var(--accent);margin-right:8px}
.strand p.what{font-size:28px;color:#dbe2f2;max-width:1400px}
.stdlist{display:flex;gap:22px}
.stdlist button{flex:1;max-width:520px}
.stdlist .ic{width:64px;height:64px;color:#fff;opacity:.9}.stdlist .ic svg{width:64px;height:64px}
/* ---------- CBT simulator ---------- */
.cbthead{height:96px;background:linear-gradient(90deg,#16213a,#24345c);color:#fff;display:flex;align-items:center;gap:18px;padding:0 28px;flex-shrink:0}
.cbthead .ct{flex:1;display:flex;flex-direction:column}.cbthead .ct b{font-family:var(--display);font-size:28px}.cbthead .ct span{font-size:19px;color:#b9c5e0}
.cbthead .who{font-size:21px;color:#dbe2f2}
